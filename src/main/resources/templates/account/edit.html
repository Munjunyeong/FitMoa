<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>정보 수정 · 핏모아(FitMoa)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" th:href="@{/bank}"><span class="brand-mark">F</span> 핏모아(FitMoa)</a>
    <nav class="nav">
      <a th:href="@{/bank}"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>계좌</a>
      <a th:href="@{/account/profile}" class="active"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>내 정보</a>
    </nav>
    <div class="side-foot">
      <div class="me"><span class="avatar">F</span><div><b>핏모아</b><small>내 계정</small></div></div>
      <a class="logout" th:href="@{/logout}"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>로그아웃</a>
    </div>
  </aside>

  <main class="main">
    <a class="back" th:href="@{/account/profile}"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>내 정보</a>
    <div class="page-head"><div><h1>계정 정보 수정</h1><p>변경할 정보를 입력해 주세요.</p></div></div>

    <div class="split">
      <form class="card" th:action="@{/account/profile/edit}" th:object="${account}" method="post">
        <div class="field">
          <label for="id">아이디</label>
          <input class="input" id="id" type="text" th:field="*{id}" readonly>
          <span class="hint">아이디는 변경할 수 없습니다.</span>
        </div>
        <div class="field">
          <label for="name">이름</label>
          <input class="input" id="name" type="text" th:field="*{name}" maxlength="11" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="phone">전화번호</label>
          <input class="input" id="phone" type="tel" th:field="*{phone}" maxlength="13" autocomplete="tel" placeholder="010-1234-5678">
        </div>
        <div class="field">
          <label for="password">새 비밀번호 <span class="muted" style="font-weight:500">(변경할 때만 입력)</span></label>
          <input class="input" id="password" name="password" type="password" autocomplete="new-password" placeholder="새 비밀번호">
          <span class="hint">비워 두면 현재 비밀번호를 유지합니다.</span>
        </div>
        <div class="row" style="margin-top:8px">
          <a class="btn btn-ghost" th:href="@{/account/profile}">취소</a>
          <button class="btn btn-primary" type="submit">변경 내용 저장</button>
        </div>
      </form>
      <aside class="card">
        <div class="card-title">안내</div>
        <div class="note"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>비밀번호를 변경하지 않을 경우 새 비밀번호 입력란을 비워 두세요.</span></div>
      </aside>
    </div>
  </main>
</div>
</body>
</html>
