<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>내 정보 · 핏모아(FitMoa)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" th:href="@{/bank}"><span class="brand-mark">F</span> 핏모아(FitMoa)</a>
    <nav class="nav">
      <a th:href="@{/bank}"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>계좌</a>
      <a th:href="@{/account/profile}" class="active"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>내 정보</a>
    </nav>
    <div class="side-foot">
      <div class="me"><span class="avatar">F</span><div><b>핏모아</b><small>내 계정</small></div></div>
      <a class="logout" th:href="@{/logout}"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>로그아웃</a>
    </div>
  </aside>

  <main class="main">
    <p class="note" th:if="${message}" th:text="${message}" role="status"></p>
    <div class="page-head">
      <div><h1>내 정보</h1><p>핏모아 계정 정보를 확인하세요.</p></div>
      <a class="btn btn-primary" th:href="@{/account/profile/edit}">정보 수정</a>
    </div>

    <section class="hero">
      <div>
        <small>핏모아 회원</small>
        <div class="big" th:text="${account.name}">이름</div>
        <small style="display:block;margin-top:6px" th:text="|아이디 · ${account.id}|">아이디</small>
      </div>
    </section>

    <section class="card" style="margin-top:22px">
      <div class="card-title">계정 정보</div>
      <div class="sum-row"><span>아이디</span><b th:text="${account.id}">아이디</b></div>
      <div class="sum-row"><span>이름</span><b th:text="${account.name}">이름</b></div>
      <div class="sum-row"><span>전화번호</span><b th:text="${account.phone != null and !account.phone.isBlank() ? account.phone : '등록되지 않음'}">전화번호</b></div>
      <div class="sum-row"><span>가입일</span><b th:text="${account.createdAt != null ? account.createdAt : '정보 없음'}">가입일</b></div>
    </section>

    <section class="card" style="margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap">
      <div><div class="card-title">계정 삭제</div><p class="muted">계정을 삭제하면 다시 로그인할 수 없습니다.</p></div>
      <form th:action="@{/account/profile/delete}" method="post" data-confirm="정말 계정을 삭제할까요? 삭제 후에는 되돌릴 수 없습니다.">
        <button class="btn btn-danger" type="submit">계정 삭제</button>
      </form>
    </section>
  </main>
</div>
<script th:src="@{/app.js}"></script>
</body>
</html>
