<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="|${pageTitle} · 핏모아(FitMoa)|">지출 등록 · 핏모아(FitMoa)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../static/style.css" th:href="@{/style.css}">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="/bank"><span class="brand-mark">F</span> 핏모아(FitMoa)</a>
    <nav class="nav">
      <a href="/bank"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>계좌</a>
      <a href="/bank/transfer"><svg class="i" viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>이체</a>
      <a href="/expenses" class="active"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>가계부</a>
      <a href="/goals"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>저축함</a>
    </nav>
    <div class="side-foot">
      <div class="me"><span class="avatar">F</span><div><b>핏모아</b><small>내 자산 관리</small></div></div>
      <a class="logout" href="/logout"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>로그아웃</a>
    </div>
  </aside>

  <main class="main">
    <a class="back" th:href="@{/expenses(month=${month})}"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>가계부</a>
    <div class="page-head"><div><h1 th:text="${pageTitle}">지출 등록</h1><p>지출 카테고리와 금액, 날짜를 입력하세요.</p></div></div>
    <p class="alert" th:if="${error}" th:text="${error}" role="alert"></p>

    <form class="card" style="max-width:640px" th:action="${formAction}" th:object="${expense}" method="post">
      <input type="hidden" name="month" th:value="${month}">
      <div class="field">
        <label for="categoryName">카테고리</label>
        <input class="input" id="categoryName" type="text" th:field="*{categoryName}" list="expenseCategories" maxlength="50" placeholder="예) 식비" required>
        <datalist id="expenseCategories">
          <option value="식비"><option value="교통"><option value="쇼핑"><option value="주거/통신">
          <option value="문화/여가"><option value="의료"><option value="교육"><option value="기타">
        </datalist>
      </div>
      <div class="field">
        <label for="amount">금액</label>
        <div class="input-wrap">
          <input class="input input-lg" id="amount" type="number" th:field="*{amount}" min="1" step="1" placeholder="0" required>
          <span class="unit">원</span>
        </div>
        <div class="chips">
          <button type="button" class="chip" data-add="1000" data-target="#amount">+1천</button>
          <button type="button" class="chip" data-add="5000" data-target="#amount">+5천</button>
          <button type="button" class="chip" data-add="10000" data-target="#amount">+1만</button>
          <button type="button" class="chip" data-add="50000" data-target="#amount">+5만</button>
        </div>
      </div>
      <div class="field">
        <label for="spentAt">지출 날짜</label>
        <input class="input" id="spentAt" type="date" th:field="*{spentAt}" required>
      </div>
      <div class="row" style="margin-top:8px">
        <a class="btn btn-ghost" th:href="@{/expenses(month=${month})}">취소</a>
        <button class="btn btn-primary" type="submit" th:text="${pageTitle}">저장하기</button>
      </div>
    </form>
  </main>
</div>
<script src="../static/app.js" th:src="@{/app.js}"></script>
</body>
</html>
