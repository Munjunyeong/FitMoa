<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지출 등록 · 핏모아(FitMoa)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">F</span> 핏모아(FitMoa)</div>
    <nav class="nav">
      <a href="/banking/accounts"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>계좌</a>
      <a href="/banking/transfer"><svg class="i" viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>이체</a>
      <a href="/expenses" class="active"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>가계부</a>
      <a href="/goals"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>저축함</a>
    </nav>
    <div class="side-foot">
      <div class="me"><span class="avatar">홍</span><div><b>홍길동</b><small>gildong</small></div></div>
      <form action="/accounts/logout" method="post" data-next="login.html">
        <button class="logout" type="submit"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>로그아웃</button>
      </form>
    </div>
  </aside>

  <main class="main">
    <a class="back" href="/expenses"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>가계부</a>
    <div class="page-head">
      <div>
        <h1>지출 등록</h1>
        <p>쓴 돈을 기록하고 카테고리별로 모아 보세요.</p>
      </div>
    </div>

    <form class="card" style="max-width:640px" action="/expenses" method="post" data-next="expenses.html">
      <div class="field">
        <label for="amount">금액</label>
        <div class="input-wrap">
          <input class="input input-lg" type="number" id="amount" name="amount" min="1" placeholder="0" required autofocus>
          <span class="unit" style="right:18px">원</span>
        </div>
        <div class="chips">
          <button type="button" class="chip" data-add="1000" data-target="#amount">+1천</button>
          <button type="button" class="chip" data-add="5000" data-target="#amount">+5천</button>
          <button type="button" class="chip" data-add="10000" data-target="#amount">+1만</button>
          <button type="button" class="chip" data-add="50000" data-target="#amount">+5만</button>
        </div>
      </div>

      <div class="field">
        <label class="label">카테고리</label>
        <div class="cat-grid">
          <label><input type="radio" name="categoryId" value="1" checked><span><em>🍚</em>식비</span></label>
          <label><input type="radio" name="categoryId" value="2"><span><em>🚌</em>교통</span></label>
          <label><input type="radio" name="categoryId" value="3"><span><em>🛍</em>쇼핑</span></label>
          <label><input type="radio" name="categoryId" value="4"><span><em>🏠</em>주거/통신</span></label>
          <label><input type="radio" name="categoryId" value="5"><span><em>🎬</em>문화/여가</span></label>
          <label><input type="radio" name="categoryId" value="6"><span><em>💊</em>의료</span></label>
          <label><input type="radio" name="categoryId" value="7"><span><em>📚</em>교육</span></label>
          <label><input type="radio" name="categoryId" value="8"><span><em>📦</em>기타</span></label>
        </div>
      </div>

      <div class="field">
        <label for="title">내용</label>
        <input class="input" id="title" name="title" maxlength="30" placeholder="예) 점심 - 김밥천국" required>
      </div>

      <div class="row">
        <div class="field">
          <label for="date">날짜</label>
          <input class="input" type="date" id="date" name="spentDate" value="2026-11-20" required>
        </div>
        <div class="field">
          <label for="acct">결제 계좌</label>
          <select class="select" id="acct" name="accountId">
            <option value="">선택 안 함 (현금 등)</option>
            <option value="1" selected>생활비 통장</option>
            <option value="2">월급 통장</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="memo">메모 <span class="muted" style="font-weight:500">(선택)</span></label>
        <textarea class="textarea" id="memo" name="memo" maxlength="100" placeholder="추가로 남기고 싶은 내용을 적어 보세요."></textarea>
      </div>

      <div class="row" style="margin-top:6px">
        <a class="btn btn-ghost" href="/expenses">취소</a>
        <button class="btn btn-primary" type="submit">등록하기</button>
      </div>
    </form>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
