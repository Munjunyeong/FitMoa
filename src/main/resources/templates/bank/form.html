<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="|${pageTitle} · 핏모아(FitMoa)|">계좌 정보 · 핏모아(FitMoa)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../static/style.css" th:href="@{/style.css}">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" th:href="@{/bank}"><span class="brand-mark">F</span> 핏모아(FitMoa)</a>
    <nav class="nav">
      <a th:href="@{/bank}" class="active"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>계좌</a>
      <a th:href="@{/bank/transfer}"><svg class="i" viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>이체</a>
      <a th:href="@{/expenses}">가계부</a><a th:href="@{/goals}">저축함</a>
    </nav>
    <div class="side-foot"><div class="me"><span class="avatar">F</span><div><b>핏모아</b><small>내 자산 관리</small></div></div><a class="logout" th:href="@{/logout}">로그아웃</a></div>
  </aside>
  <main class="main">
    <p class="alert" th:if="${error}" th:text="${error}" role="alert"></p>
    <a class="back" th:href="@{/bank}"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>내 계좌</a>
    <div class="page-head"><div><h1 th:text="${pageTitle}">계좌 등록</h1><p>계좌 정보를 입력해 주세요.</p></div></div>
    <div class="split">
      <form class="card" th:action="${formAction}" th:object="${bankAccount}" method="post">
        <div class="field"><label for="bankName">은행명 또는 별칭</label><input class="input" id="bankName" th:field="*{bankName}" maxlength="50" placeholder="예) 생활비 통장" required></div>
        <div class="field"><label for="accountType">계좌 종류</label>
          <select class="select" id="accountType" th:field="*{accountType}" required>
            <option value="">선택해 주세요</option>
            <option value="CHECKING">입출금</option><option value="DEPOSIT">예금</option><option value="SAVINGS">적금</option>
          </select>
        </div>
        <div class="field" th:if="${isNew}"><label for="balance">현재 잔액</label><div class="input-wrap"><input class="input input-lg" type="number" id="balance" th:field="*{balance}" min="0" step="1" required><span class="unit" style="right:18px">원</span></div><span class="hint">등록 시점의 시작 잔액을 입력해 주세요.</span></div>
        <div class="field" th:unless="${isNew}"><label>현재 잔액</label><b class="num" th:text="|${#numbers.formatInteger(bankAccount.balance, 1, 'COMMA')}원|">0원</b><span class="hint">잔액은 거래 내역에 따라 변경됩니다.</span></div>
        <div class="row" style="margin-top:8px"><a class="btn btn-ghost" th:href="@{/bank}">취소</a><button class="btn btn-primary" type="submit" th:text="${isNew ? '계좌 등록' : '변경 내용 저장'}">저장</button></div>
      </form>
      <aside class="card"><div class="card-title">안내</div><div class="note"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>계좌 잔액은 계좌 간 이체와 저축 목표 적립·출금 내역으로 관리됩니다.</span></div></aside>
    </div>
  </main>
</div>
<script src="../../static/app.js" th:src="@{/app.js}"></script>
</body>
</html>
