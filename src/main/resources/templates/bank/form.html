<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계좌 개설 · 핏모아(FitMoa)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../static/style.css" th:href="@{/style.css}">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">F</span> 핏모아(FitMoa)</div>
    <nav class="nav">
      <a href="/banking/accounts" class="active"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>계좌</a>
      <a href="/banking/transfer"><svg class="i" viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>이체</a>
      <a href="/expenses"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>가계부</a>
      <a href="/goals"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>저축함</a>
    </nav>
    <div class="side-foot">
      <div class="me"><span class="avatar">홍</span><div><b>홍길동</b><small>gildong</small></div></div>
      <form action="logout">
        <button class="logout" type="submit"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>로그아웃</button>
      </form>
    </div>
  </aside>

  <main class="main">
    <a class="back" href="/banking/accounts"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>내 계좌</a>
    <div class="page-head">
      <div>
        <h1>계좌 개설</h1>
        <p>새 계좌 정보를 입력해 주세요.</p>
      </div>
    </div>

    <div class="split">
      <form class="card" action="/banking/accounts" method="post">
        <div class="field">
          <label for="alias">계좌 별칭</label>
          <input class="input" id="alias" name="alias" placeholder="예) 생활비 통장" maxlength="20" required>
          <span class="hint">최대 20자까지 입력할 수 있어요.</span>
        </div>

        <div class="field">
          <label class="label">계좌 종류</label>
          <div class="type-pick">
            <label><input type="radio" name="type" value="CHECKING" checked><span>입출금<small>자유롭게 입출금</small></span></label>
            <label><input type="radio" name="type" value="SAVINGS"><span>적금<small>매달 모으기</small></span></label>
            <label><input type="radio" name="type" value="DEPOSIT"><span>예금<small>목돈 굴리기</small></span></label>
          </div>
        </div>

        <div class="field">
          <label for="bank">은행</label>
          <select class="select" id="bank" name="bank">
            <option>머니은행</option>
            <option>한빛은행</option>
            <option>새봄은행</option>
          </select>
        </div>

        <div class="field">
          <label for="initial">초기 입금액 <span class="muted" style="font-weight:500">(선택)</span></label>
          <div class="input-wrap">
            <input class="input" type="number" id="initial" name="initialBalance" min="0" step="1000" placeholder="0">
            <span class="unit">원</span>
          </div>
          <div class="chips">
            <button type="button" class="chip" data-add="10000" data-target="#initial">+1만</button>
            <button type="button" class="chip" data-add="50000" data-target="#initial">+5만</button>
            <button type="button" class="chip" data-add="100000" data-target="#initial">+10만</button>
            <button type="button" class="chip" data-add="1000000" data-target="#initial">+100만</button>
          </div>
        </div>

        <div class="row" style="margin-top:8px">
          <a class="btn btn-ghost" href="/banking/accounts">취소</a>
          <button class="btn btn-primary" type="submit">계좌 개설하기</button>
        </div>
      </form>

      <aside class="card">
        <div class="card-title">개설 전 확인하세요</div>
        <div class="sum-row"><span>계좌번호</span><b>자동 발급</b></div>
        <div class="sum-row"><span>개설 수수료</span><b>무료</b></div>
        <div class="sum-row"><span>최대 개설 수</span><b>10개</b></div>
        <div class="note"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>계좌번호는 개설 완료 후 계좌 목록에서 확인할 수 있어요.</span></div>
      </aside>
    </div>
  </main>
</div>
<script src="../../static/app.js" th:src="@{/app.js}"></script>
</body>
</html>
