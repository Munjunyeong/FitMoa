<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계좌 이체 · 핏모아(FitMoa)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../static/style.css" th:href="@{/style.css}">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" th:href="@{/bank}"><span class="brand-mark">F</span> 핏모아(FitMoa)</a>
    <nav class="nav"><a th:href="@{/bank}">계좌</a><a th:href="@{/bank/transfer}" class="active">이체</a><a th:href="@{/expenses}">가계부</a><a th:href="@{/goals}">저축함</a></nav>
    <div class="side-foot"><div class="me"><span class="avatar">F</span><div><b>핏모아</b><small>내 자산 관리</small></div></div><a class="logout" th:href="@{/logout}">로그아웃</a></div>
  </aside>
  <main class="main">
    <p class="alert" th:if="${error}" th:text="${error}" role="alert"></p>
    <div class="page-head"><div><h1>계좌 이체</h1><p>내 계좌 사이에서 잔액을 옮깁니다.</p></div></div>
    <section class="card empty" th:if="${#lists.size(accounts) < 2}">이체하려면 내 계좌가 두 개 이상 필요합니다.<br><a class="btn btn-primary" style="margin-top:14px" th:href="@{/bank/new}">계좌 등록하기</a></section>
    <form class="split" th:unless="${#lists.size(accounts) < 2}" th:action="@{/bank/transfer}" method="post">
      <div class="card">
        <div class="field"><label for="fromAccountId">출금 계좌</label><select class="select" id="fromAccountId" name="fromAccountId" required>
          <option value="">선택해 주세요</option><option th:each="account : ${accounts}" th:value="${account.bankAccountId}" th:text="|${account.bankName} · 잔액 ${#numbers.formatInteger(account.balance, 1, 'COMMA')}원|">계좌</option>
        </select></div>
        <div class="field"><label for="toAccountId">입금 계좌</label><select class="select" id="toAccountId" name="toAccountId" required>
          <option value="">선택해 주세요</option><option th:each="account : ${accounts}" th:value="${account.bankAccountId}" th:text="|${account.bankName} · 잔액 ${#numbers.formatInteger(account.balance, 1, 'COMMA')}원|">계좌</option>
        </select></div>
        <div class="field"><label for="amount">이체 금액</label><div class="input-wrap"><input class="input input-lg" id="amount" name="amount" type="number" min="1" step="1" placeholder="0" required><span class="unit" style="right:18px">원</span></div>
          <div class="chips"><button type="button" class="chip" data-add="10000" data-target="#amount">+1만</button><button type="button" class="chip" data-add="50000" data-target="#amount">+5만</button><button type="button" class="chip" data-add="100000" data-target="#amount">+10만</button></div>
        </div>
        <div class="field"><label for="memo">메모 <span class="muted">(선택)</span></label><input class="input" id="memo" name="memo" maxlength="250" placeholder="이체 메모"></div>
      </div>
      <aside class="card summary"><div class="card-title">이체 안내</div><div class="note"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>출금 계좌 잔액, 입금 계좌 잔액, 양쪽 거래 내역을 한 번에 저장합니다. 본인 계좌끼리만 이체할 수 있습니다.</span></div>
        <button class="btn btn-primary btn-block" style="margin-top:18px" type="submit">이체하기</button>
      </aside>
    </form>
  </main>
</div>
<script src="../../static/app.js" th:src="@{/app.js}"></script>
</body>
</html>
