<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계좌 이체 · 핏모아(FitMoa)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">F</span> 핏모아(FitMoa)</div>
    <nav class="nav">
      <a href="/banking/accounts"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>계좌</a>
      <a href="/banking/transfer" class="active"><svg class="i" viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>이체</a>
      <a href="/expenses"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>가계부</a>
      <a href="/goals"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>저축함</a>
    </nav>
    <div class="side-foot">
      <div class="me"><span class="avatar">홍</span><div><b>홍길동</b><small>gildong</small></div></div>
      <form action="/accounts/logout" method="post" data-next="login.html">
        <button class="logout" type="submit"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>로그아웃</button>
      </form>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1>계좌 이체</h1>
        <p>내 계좌에서 다른 계좌로 돈을 보내요.</p>
      </div>
    </div>

    <form class="split" action="/banking/transfer" method="post" data-next="accounts.html">
      <div class="card">
        <div class="field">
          <label for="from">출금 계좌</label>
          <select class="select" id="from" name="fromAccountId">
            <option value="1">생활비 통장 · 3,284,500원</option>
            <option value="2">월급 통장 · 2,147,600원</option>
            <option value="4">비상금 · 600,000원</option>
          </select>
        </div>

        <div class="row">
          <div class="field" style="flex:0 0 38%">
            <label for="bank">입금 은행</label>
            <select class="select" id="bank" name="toBank">
              <option>머니은행</option>
              <option>한빛은행</option>
              <option>새봄은행</option>
            </select>
          </div>
          <div class="field">
            <label for="to">입금 계좌번호</label>
            <input class="input" id="to" name="toAccountNumber" inputmode="numeric" placeholder="'-' 없이 숫자만 입력" required>
          </div>
        </div>

        <div class="field">
          <label for="amount">이체 금액</label>
          <div class="input-wrap">
            <input class="input input-lg" type="number" id="amount" name="amount" min="1" placeholder="0" required>
            <span class="unit" style="right:18px">원</span>
          </div>
          <div class="chips">
            <button type="button" class="chip" data-add="10000" data-target="#amount">+1만</button>
            <button type="button" class="chip" data-add="50000" data-target="#amount">+5만</button>
            <button type="button" class="chip" data-add="100000" data-target="#amount">+10만</button>
            <button type="button" class="chip" data-add="1000000" data-target="#amount">+100만</button>
            <button type="button" class="chip" data-add="all" data-all="3284500" data-target="#amount">전액</button>
          </div>
        </div>

        <div class="field">
          <label for="memo">받는 분께 표시 <span class="muted" style="font-weight:500">(선택)</span></label>
          <input class="input" id="memo" name="memo" maxlength="20" placeholder="예) 점심 정산">
        </div>
      </div>

      <aside class="card summary">
        <div class="card-title">이체 요약</div>
        <div class="sum-row"><span>출금 계좌</span><b>생활비 통장</b></div>
        <div class="sum-row"><span>이체 금액</span><b class="num" id="sum-amount">0원</b></div>
        <div class="sum-row"><span>수수료</span><b>무료</b></div>
        <div class="sum-total"><span>총 출금액</span><b class="num" id="sum-total">0원</b></div>
        <button class="btn btn-primary btn-block" style="margin-top:18px" type="submit">이체하기</button>
        <div class="note"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>이체가 완료되면 취소할 수 없어요. 계좌번호를 다시 한 번 확인해 주세요.</span></div>
      </aside>
    </form>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
