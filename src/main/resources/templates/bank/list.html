<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 계좌 · 핏모아(FitMoa)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">F</span> 핏모아(FitMoa)</div>
    <nav class="nav">
      <a href="/banking/accounts" class="active"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>계좌</a>
      <a href="/banking/transfer"><svg class="i" viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>이체</a>
      <a href="/expenses"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>가계부</a>
      <a href="/goals"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>저축함</a>
    </nav>
    <div class="side-foot">
      <div class="me"><span class="avatar">홍</span><div><b>홍길동</b><small>gildong</small></div></div>
      <form action="logout">
        <button class="logout" type="submit"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>로그아웃</button>
      </form>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1>내 계좌</h1>
        <p>보유 중인 계좌와 잔액을 확인하세요.</p>
      </div>
      <a href="/banking/accounts/new" class="btn btn-primary"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>계좌 개설</a>
    </div>

    <section class="hero">
      <div>
        <small>총 잔액</small>
        <div class="big num">8,432,100원</div>
        <small style="display:block;margin-top:6px">계좌 4개 · 오늘 09:41 기준</small>
      </div>
      <div class="actions">
        <a class="btn solid" href="/banking/transfer"><svg class="i" viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>이체하기</a>
      </div>
    </section>

    <section class="acct-list">
      <a class="acct-card c1" href="/banking/accounts/1">
        <div class="top"><div><div class="nm">생활비 통장</div><div class="no">머니은행 110-482-337201</div></div><span class="tag">입출금</span></div>
        <div class="bal"><small>잔액</small><b class="num">3,284,500원</b></div>
      </a>
      <a class="acct-card c2" href="/banking/accounts/2">
        <div class="top"><div><div class="nm">월급 통장</div><div class="no">머니은행 110-482-519034</div></div><span class="tag">입출금</span></div>
        <div class="bal"><small>잔액</small><b class="num">2,147,600원</b></div>
      </a>
      <a class="acct-card c3" href="/banking/accounts/3">
        <div class="top"><div><div class="nm">여행 적금</div><div class="no">머니은행 210-773-120458</div></div><span class="tag">적금</span></div>
        <div class="bal"><small>잔액</small><b class="num">2,400,000원</b></div>
      </a>
      <a class="acct-card c4" href="/banking/accounts/4">
        <div class="top"><div><div class="nm">비상금</div><div class="no">머니은행 110-482-880921</div></div><span class="tag">예금</span></div>
        <div class="bal"><small>잔액</small><b class="num">600,000원</b></div>
      </a>
    </section>

    <!-- 계좌가 없을 때 -->
    <!-- <div class="card empty">아직 개설한 계좌가 없어요.<br><a class="btn btn-primary" style="margin-top:14px" href="/banking/accounts/new">첫 계좌 만들기</a></div> -->
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
