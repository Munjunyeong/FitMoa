<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계좌 상세 · 핏모아(FitMoa)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../static/style.css" th:href="@{/style.css}">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">F</span> 핏모아(FitMoa)</div>
    <nav class="nav">
      <a href="/bank" class="active"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>계좌</a>
      <a href="/bank/transfer"><svg class="i" viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>이체</a>
      <a href="/expenses"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>가계부</a>
      <a href="/goals"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>저축함</a>
    </nav>
    <div class="side-foot">
      <div class="me"><span class="avatar">F</span><div><b>핏모아</b><small>내 자산 관리</small></div></div>
      <a class="logout" href="/logout"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>로그아웃</a>
    </div>
  </aside>

  <main class="main">
    <a class="back" href="/bank"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>내 계좌</a>

    <section class="card empty" th:if="${bankAccount == null}">
      <h1>계좌가 없습니다</h1>
      <p>요청한 계좌를 찾을 수 없거나 현재 계정에 등록된 계좌가 아닙니다.</p>
      <a class="btn btn-primary" href="/bank" style="margin-top:16px">계좌 목록으로</a>
    </section>

    <div th:if="${bankAccount != null}">
      <section class="hero">
        <div>
          <small th:text="|${bankAccount.bankName} · ${bankAccount.accountType}|">은행명 · 계좌 종류</small>
          <div class="big num" th:text="|${#numbers.formatInteger(bankAccount.balance, 1, 'COMMA')}원|">0원</div>
          <small style="display:block;margin-top:8px" th:text="|계좌 ID · ${bankAccount.bankAccountId}|">계좌 ID</small>
        </div>
        <div class="actions">
          <a class="btn solid" th:href="@{/bank/{id}/edit(id=${bankAccount.bankAccountId})}">계좌 정보 수정</a>
        </div>
      </section>

      <section class="card" style="margin-top:22px">
        <div class="card-title">계좌 정보</div>
        <div class="sum-row"><span>은행명</span><b th:text="${bankAccount.bankName}">은행명</b></div>
        <div class="sum-row"><span>계좌 종류</span><b th:text="${bankAccount.accountType}">계좌 종류</b></div>
        <div class="sum-row"><span>현재 잔액</span><b class="num" th:text="|${#numbers.formatInteger(bankAccount.balance, 1, 'COMMA')}원|">0원</b></div>
      </section>

      <section class="card" style="margin-top:22px">
        <div class="card-title">최근 거래 내역</div>
        <div class="empty" th:if="${#lists.isEmpty(history)}">등록된 거래 내역이 없습니다.</div>
        <div style="overflow-x:auto" th:unless="${#lists.isEmpty(history)}">
          <table style="min-width:720px;width:100%;border-collapse:collapse;text-align:left"><thead><tr><th style="padding:10px">일시</th><th style="padding:10px">유형</th><th style="padding:10px">메모</th><th style="padding:10px">금액</th><th style="padding:10px">거래 후 잔액</th></tr></thead>
            <tbody><tr th:each="item : ${history}">
              <td th:text="${#temporals.format(item.createdAt, 'yyyy.MM.dd HH:mm')}">일시</td>
              <td th:text="${item.txType}">유형</td>
              <td th:text="${item.txMemo != null and !item.txMemo.isBlank() ? item.txMemo : (item.counterpartyAccountId != null ? item.counterpartyAccountId : '-')}">메모</td>
              <td class="num" th:text="|${#numbers.formatInteger(item.amount, 1, 'COMMA')}원|">0원</td>
              <td class="num" th:text="|${#numbers.formatInteger(item.balanceAfter, 1, 'COMMA')}원|">0원</td>
            </tr></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
