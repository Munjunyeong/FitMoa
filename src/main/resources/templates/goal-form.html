<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>저축함 만들기 · 핏모아(FitMoa)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">F</span> 핏모아(FitMoa)</div>
    <nav class="nav">
      <a href="/banking/accounts"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>계좌</a>
      <a href="/banking/transfer"><svg class="i" viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>이체</a>
      <a href="/expenses"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>가계부</a>
      <a href="/goals" class="active"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>저축함</a>
    </nav>
    <div class="side-foot">
      <div class="me"><span class="avatar">홍</span><div><b>홍길동</b><small>gildong</small></div></div>
      <form action="/accounts/logout" method="post" data-next="login.html">
        <button class="logout" type="submit"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>로그아웃</button>
      </form>
    </div>
  </aside>

  <main class="main">
    <a class="back" href="/goals"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>저축함</a>
    <div class="page-head">
      <div>
        <h1>저축함 만들기</h1>
        <p>이루고 싶은 목표와 기한을 정해 보세요.</p>
      </div>
    </div>

    <div class="split">
      <form class="card" action="/goals" method="post" data-next="goals.html">
        <div class="field">
          <label for="name">저축함 이름</label>
          <input class="input" id="name" name="name" maxlength="20" placeholder="예) 일본 여행" required autofocus>
        </div>

        <div class="field">
          <label class="label">아이콘</label>
          <div class="icon-pick">
            <label><input type="radio" name="icon" value="✈️" checked><span>✈️</span></label>
            <label><input type="radio" name="icon" value="💻"><span>💻</span></label>
            <label><input type="radio" name="icon" value="🏠"><span>🏠</span></label>
            <label><input type="radio" name="icon" value="🚗"><span>🚗</span></label>
            <label><input type="radio" name="icon" value="🎁"><span>🎁</span></label>
            <label><input type="radio" name="icon" value="💍"><span>💍</span></label>
          </div>
        </div>

        <div class="field">
          <label class="label">테마 색상</label>
          <div class="color-pick">
            <label><input type="radio" name="color" value="#2f6bff" checked><span style="background:#2f6bff"></span></label>
            <label><input type="radio" name="color" value="#7c5cff"><span style="background:#7c5cff"></span></label>
            <label><input type="radio" name="color" value="#12b5cb"><span style="background:#12b5cb"></span></label>
            <label><input type="radio" name="color" value="#0a9d6b"><span style="background:#0a9d6b"></span></label>
            <label><input type="radio" name="color" value="#f5a524"><span style="background:#f5a524"></span></label>
            <label><input type="radio" name="color" value="#f04452"><span style="background:#f04452"></span></label>
          </div>
        </div>

        <div class="field">
          <label for="target">목표 금액</label>
          <div class="input-wrap">
            <input class="input input-lg" type="number" id="target" name="targetAmount" min="1000" step="1000" placeholder="0" required>
            <span class="unit" style="right:18px">원</span>
          </div>
          <div class="chips">
            <button type="button" class="chip" data-add="100000" data-target="#target">+10만</button>
            <button type="button" class="chip" data-add="500000" data-target="#target">+50만</button>
            <button type="button" class="chip" data-add="1000000" data-target="#target">+100만</button>
            <button type="button" class="chip" data-add="5000000" data-target="#target">+500만</button>
          </div>
        </div>

        <div class="field">
          <label for="deadline">목표 기한</label>
          <input class="input" type="date" id="deadline" name="deadline" min="2026-11-21" required>
          <span class="hint">기한이 지나도 저축함은 유지돼요.</span>
        </div>

        <div class="row" style="margin-top:6px">
          <a class="btn btn-ghost" href="/goals">취소</a>
          <button class="btn btn-primary" type="submit">저축함 만들기</button>
        </div>
      </form>

      <aside class="card summary">
        <div class="card-title">미리보기</div>
        <div class="preview">
          <div class="ring" style="--v:0;--c:#2f6bff"><b>0%</b></div>
          <div>
            <h3 style="font-size:17px">✈️ 내 저축함</h3>
            <div class="muted" style="font-size:13px;margin-top:4px">0원 / 목표 금액</div>
          </div>
        </div>
        <div class="note" style="background:var(--primary-soft);color:var(--primary-d)"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>만든 뒤에는 목록에서 언제든 적립·출금할 수 있어요.</span></div>
      </aside>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
