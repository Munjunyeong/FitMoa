<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="|${pageTitle} · 핏모아(FitMoa)|">저축함 · 핏모아(FitMoa)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../static/style.css" th:href="@{/style.css}">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="/bank"><span class="brand-mark">F</span> 핏모아(FitMoa)</a>
    <nav class="nav">
      <a href="/bank"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>계좌</a>
      <a href="/bank/transfer"><svg class="i" viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>이체</a>
      <a href="/expenses"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>가계부</a>
      <a href="/goals" class="active"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>저축함</a>
    </nav>
    <div class="side-foot"><div class="me"><span class="avatar">F</span><div><b>핏모아</b><small>내 자산 관리</small></div></div><a class="logout" href="/logout">로그아웃</a></div>
  </aside>
  <main class="main">
    <p class="alert" th:if="${error}" th:text="${error}" role="alert"></p>
    <a class="back" href="/goals"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>저축함</a>
    <div class="page-head"><div><h1 th:text="${pageTitle}">저축함 만들기</h1><p>이루고 싶은 목표와 기한을 정해 보세요.</p></div></div>
    <div class="split">
      <form class="card" th:action="${formAction}" action="/goals" method="post">
        <div class="field"><label for="goalTitle">저축함 이름</label><input class="input" id="goalTitle" name="goalTitle" maxlength="50" placeholder="예) 일본 여행" required autofocus th:value="${goal.goalTitle}"></div>
        <div class="field"><label for="targetAmount">목표 금액</label><div class="input-wrap"><input class="input input-lg" type="number" id="targetAmount" name="targetAmount" min="1" step="1" placeholder="0" required th:value="${goal.targetAmount > 0 ? goal.targetAmount : ''}"><span class="unit" style="right:18px">원</span></div>
          <div class="chips"><button type="button" class="chip" data-add="100000" data-target="#targetAmount">+10만</button><button type="button" class="chip" data-add="500000" data-target="#targetAmount">+50만</button><button type="button" class="chip" data-add="1000000" data-target="#targetAmount">+100만</button><button type="button" class="chip" data-add="5000000" data-target="#targetAmount">+500만</button></div>
          <span class="hint" th:if="${goal.goalId != null}" th:text="|현재 모은 금액 ${#numbers.formatInteger(goal.currentAmount, 1, 'COMMA')}원보다 낮게 설정할 수 없습니다.|">현재 모은 금액을 고려해 목표를 설정하세요.</span>
        </div>
        <div class="field"><label for="endDate">목표 기한</label><input class="input" type="date" id="endDate" name="endDate" required th:value="${goal.endDate}"><span class="hint">기한이 지나도 저축함은 유지돼요.</span></div>
        <div class="row" style="margin-top:6px"><a class="btn btn-ghost" href="/goals">취소</a><button class="btn btn-primary" type="submit" th:text="${goal.goalId == null ? '저축함 만들기' : '수정 내용 저장'}">저장</button></div>
      </form>
      <aside class="card summary"><div class="card-title">안내</div><div class="note" style="background:var(--primary-soft);color:var(--primary-d)"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>목표 이름, 목표 금액, 기한을 입력해 주세요. 적립과 출금은 저축 목표 금액에 반영됩니다.</span></div></aside>
    </div>
  </main>
</div>
<script src="../static/app.js" th:src="@{/app.js}"></script>
</body>
</html>
